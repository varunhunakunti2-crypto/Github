name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: gitforge
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Database Client (Prisma)
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: Compile & Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/gitforge?schema=public"

      - name: Run Unit Tests (Vitest)
        run: npx turbo run test

      - name: Run Backend Integration Tests (Jest)
        run: npx turbo run test:e2e --filter=@gitforge/api
